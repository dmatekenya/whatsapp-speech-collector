# ===================
# ASSIGNMENT SETTINGS
# ===================
# config/assignment_settings.yaml: how prompts are assigned and how much each participant records.
# Read by the task bank (src/tasks/config.py: prompt selection, coverage) and the conversation
# engine (sessions, progress).
#
# - task_types: the kinds of recording a participant is asked for. Each one is either
#   - prompted: true, with speakers_per_prompt: the bot sends a prompt from the prompt bank (a
#     sentence, picture or question). speakers_per_prompt is how many different participants
#     should record each prompt; a prompt stops being assigned once it has this many accepted
#     recordings (pending ones count too); or
#   - prompted: false (no speakers_per_prompt): the bot just invites a voice note on any topic
#     (free_speech). Each invitation counts as one prompt of the session.
#   Each type also has a speech_type, used to group them in reports: scripted (read aloud from
#   a text: sentence) or spontaneous (the participant's own words: everything else). It follows
#   from the task type and isn't stored per recording.
#   The names shown to participants are in the message files (task_names, task_labels).
# - session_size: prompts per session before the bot pauses and asks the participant to continue.
# - assignment_expiry_hours: unanswered prompts go back to the pool after this long.
# - max_retakes_per_prompt: re-recordings allowed for one prompt before moving on.
# - targets_minutes: how much each participant records.
#   - per_participant: minutes in total.
#   - split: the share of those minutes per task type. It must list exactly the task types in
#     task_types and add up to 1.0, or the app refuses to start.
#   Per-type target = per_participant x share, rounded to the nearest 0.5 minute; the total shown
#   to participants is the sum of the per-type targets. A participant can be given their own in
#   the registry (participants.attributes.targets_minutes): {per_participant: 6} (split as here),
#   or explicit per-type minutes, e.g. {sentence: 2, image: 1, conversation_starter: 1}.
# - clip_seconds: accepted recording length; shorter or longer clips get a retake request.
# - clip_checks: is there speech in the clip? The worker measures every voice note on its 16 kHz
#   WAV: active seconds = time in frame_ms frames whose level is above active_dbfs (dBFS; 0 is the
#   loudest possible). Applied after the duration check, for all task types:
#   - fewer than min_active_seconds active: rejected (QC reason no_speech) and a retake request,
#     which uses up a retake like a too-short clip;
#   - otherwise, active share of the clip below min_active_ratio: accepted and counted, but marked
#     for review (QC needs_review, reason low_speech).
#   Measure real clips with scripts/check_silence.py before changing these.
# - fresh_start_after_hours: after this long without a message from the participant, their next
#   message pauses any open session and gets the welcome-back summary (progress, today's task).
#   A voice note swiped onto a still-unexpired prompt is the exception: it is taken as the answer.
#   Leave it out to use assignment_expiry_hours.
# - reply_window_hours: the bot sends nothing to a participant whose last message to that number
#   is older than this (WhatsApp's 24-hour window, with a margin). Such messages are marked
#   skipped_window and the conversation waits for their next message.
# - audio_origin: what to do with a voice note, by where it came from (recordings.audio_origin;
#   Meta tells us, Twilio doesn't, so Twilio audio is "unknown" and accepted as before):
#   - accept: used and counted as usual;
#   - reject: never used (QC rejected, reason not_recorded); the participant is asked to record
#     it themselves, and an open prompt stays open (it doesn't use up a retake);
#   - accept_flagged: used and counted, but marked for review (QC needs_review, reason
#     speaker_check_pending), e.g. audio that may not be the participant's own voice.
#   These are the rules for every task type. A task type can override some of them with its own
#   audio_origin (under task_types), e.g. free_speech accepts forwarded voice notes and audio files
#   (older recordings of the participant's own are often more natural) but flags them for a
#   speaker check.
#   Outside a session (no task type) the rules here apply. Only the origins recorded, forwarded,
#   uploaded and unknown and the three actions above are allowed, or the app refuses to start.
#
# Values are starting points for the pilot. Adjust from pilot data rather than editing code.
task_types:
  sentence:             {prompted: true, speakers_per_prompt: 5, speech_type: scripted}
  image:                {prompted: true, speakers_per_prompt: 7, speech_type: spontaneous}
  conversation_starter: {prompted: true, speakers_per_prompt: 3, speech_type: spontaneous}
  free_speech:
    prompted: false
    speech_type: spontaneous
    audio_origin:               # overrides the global audio_origin, for free speech only
      forwarded: accept_flagged # an older voice note of their own: counted, speaker check later
      uploaded: accept_flagged  # an audio file of their own: counted, speaker check later
session_size: 10              # prompts per session before the bot pauses
assignment_expiry_hours: 24   # unanswered prompts return to the pool
max_retakes_per_prompt: 2
targets_minutes:              # per participant
  per_participant: 20
  # 6 + 5 + 5 + 4 minutes: 30% scripted (sentences), 70% spontaneous (the rest).
  split: {sentence: 0.30, image: 0.25, conversation_starter: 0.25, free_speech: 0.20}
clip_seconds: {min: 5, max: 29}
clip_checks:
  frame_ms: 30                # analysis frame length
  active_dbfs: -45            # a frame louder than this has sound in it
  min_active_seconds: 1.5     # less sound than this: no_speech (rejected, retake)
  min_active_ratio: 0.20      # sound in less than 20% of the clip: low_speech (accepted, flagged)
fresh_start_after_hours: 24   # same as assignment_expiry_hours
reply_window_hours: 23.5
audio_origin:                   # for all task types, unless a task type overrides it
  recorded: accept              # a voice note recorded in WhatsApp
  forwarded: reject             # forwarded from another chat: ask for a new recording
  uploaded: reject              # an audio file attached from the phone: ask for a new recording
