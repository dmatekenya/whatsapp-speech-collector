studies:
  qc_calibration:
    enabled: false
    resume_reminder_minutes: 10
    prompts:
      sentence: S12577
      conversation_starter: C0482
    conditions:
      C1: {title: Good, reminder: "quiet room, speak clearly", tasks: [sentence, conversation_starter, free_speech]}
      C2: {title: Too quiet, reminder: "speak very quietly", tasks: [sentence, conversation_starter, free_speech]}
      C3: {title: Far away, reminder: "phone 1–2 m away", tasks: [conversation_starter, free_speech]}
      C4: {title: Background voices, reminder: "voices in the background", tasks: [sentence, conversation_starter, free_speech]}
      C5: {title: Background music, reminder: "music in the background", tasks: [sentence, conversation_starter, free_speech]}
      C6: {title: Noisy surroundings, reminder: "noise nearby", tasks: [sentence, conversation_starter, free_speech]}
      C7: {title: Echo, reminder: "use an echoey room", tasks: [sentence, conversation_starter, free_speech]}
      C8: {title: Muffled microphone, reminder: "partly cover the mic", tasks: [sentence, conversation_starter, free_speech]}
      C9: {title: Silence in a quiet room, reminder: "stay silent in a quiet room", tasks: [silence, silence, silence]}
      C10: {title: Silence with speech, reminder: "stay silent with voices nearby", tasks: [silence, silence, silence]}
