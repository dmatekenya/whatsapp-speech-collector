# Titles or categories containing these words are dropped (not photos of scenes).
unwanted_keywords:
  - map
  - logo
  - flag
  - coat of arms
  - diagram
  - chart
  - document
  - scan
  - stamp
  - banknote
  - coin
  - postcard
  - poster
  - screenshot
  - signature

allowed_mime_types:
  - image/jpeg
  - image/png
  - image/webp

