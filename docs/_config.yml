title: Chichewa Speech Project
author: ZaZo AI Ltd.
logo: images/logo.png
only_build_toc_files: true
exclude_patterns:
- _build
- '**/sources/**'
repository:
  url: https://github.com/dmatekenya/whatsapp-speech-collector
  branch: main
  path_to_book: docs
html:
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true
  favicon: images/favicon.ico
  baseurl: https://dmatekenya.github.io/whatsapp-speech-collector/
execute:
  execute_notebooks: 'off'
sphinx:
  extra_extensions:
  - sphinxcontrib.mermaid
  config:
    html_show_copyright: false
    html_last_updated_fmt: '%b %d, %Y'
parse:
  myst_enable_extensions:
  - colon_fence
  - deflist
  myst_heading_anchors: 4
