# ==================================
# PICTURE CANDIDATE HARVEST SETTINGS
# ==================================
# Used by scripts/prompt_generation/harvest_images.py. Quotas follow the prompt manual (Table 6, 6,300
# pictures). Folder keys are the short domain names used for release folders.

output_root: data/prompts/images/harvest
cache_dir: data/prompts/images/harvest/_cache

# Harvest up to quota x target_multiplier per domain, to allow for rejections.
target_multiplier: 1.5

# Minimum original image size (pixels) to keep a candidate.
min_width: 640
min_height: 480

# Thumbnail width requested from sources that can resize (pixels).
thumb_width: 512

# Keep at most this many photos from the same creator on the same day (0 = no cap).
max_per_creator_day: 15
# Keep at most this many photos from the same creator per domain (0 = no cap).
max_per_creator_domain: 60

# Near-duplicate threshold: maximum Hamming distance between perceptual hashes.
phash_max_distance: 6

# ========
# LICENCES
# ========
# Only openly licensed or public-domain images are kept. Set to true only if the project
# is confirmed as non-commercial.
allow_non_commercial: True

# Flickr geo-sweep runs once per harvest; text runs per domain query.
flickr:
  modes: [geo-sweep,text]
  api_key_env: FLICKR_API_KEY

# Politeness towards source APIs
http:
  timeout_seconds: 30
  pause_seconds: 1.0        # pause between API calls
  max_retries: 4
  contact_email_env: HARVEST_CONTACT_EMAIL

