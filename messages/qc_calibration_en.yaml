conditions:
  C1: In a quiet room, hold your phone as you normally would and speak clearly.
  C2: Hold your phone normally and speak very quietly.
  C3: Hold the phone at arm's length (about 60–70 cm) and speak normally.
  C4: Speak while people are talking in the background.
  C5: Speak while music is playing in the background.
  C6: Speak with other background noise nearby.
  C7: Speak in a room where your voice echoes.
  C8: Keep the microphone partly covered while you speak.
  C9: In a quiet room, record without speaking.
  C10: Record without speaking while people talk in the background.
